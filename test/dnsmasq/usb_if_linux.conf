strict-order
user=nobody
group=nogroup
pid-file=/run/dnsmasq-usb-if.pid

except-interface=lo
bind-dynamic
no-hosts
addn-hosts=usb_if.hosts
expand-hosts
domain=cy.askug.local

# Upstream DNS servers
server=192.168.10.254
server=8.8.4.4
server=8.8.8.8

interface=enx00e04f3a434b
listen-address=10.121.10.1
dhcp-range=10.121.10.50,10.121.10.199,255.255.255.0,24h
dhcp-option=option:dns-server,10.121.10.1,8.8.8.8,8.8.4.4
dhcp-option=option:ntp-server,80.249.145.122,94.247.111.10,192.36.143.130,91.209.94.10
dhcp-no-override
dhcp-authoritative
dhcp-lease-max=50
dhcp-leasefile=usb_if.leases

# leases
dhcp-host=juju,10.121.10.201
dhcp-host=00:16:3e:f4:61:77,10.121.10.202
dhcp-host=dc:a6:32:bd:93:1a,10.121.10.10,pi4-0,30d
